[package]
name = "salicon-annotator"
version = "0.1.0"
description = "SALICON 方式の注視アノテーションツール"
edition = "2021"

[lib]
name = "salicon_annotator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
